# DO NOT EDIT -- overwritten on every update.
#
# Default customization values for cdo-align.
# Override in _bmad/custom/cdo-align.toml or
# _bmad/custom/cdo-align.user.toml.
#
# Merge rules:
# - Strings replace the default.
# - Lists append to the default list.
# - Tables merge key by key.

[workflow]

# Extra instructions to run before config is loaded.
activation_steps_prepend = []

# Extra instructions to run after the config is loaded and before step 01.
activation_steps_append = []

# Facts kept in context for the whole run.
# Entries are literal text or file references prefixed with "file:".
persistent_facts = []

# Instruction run after the filing Report completes.
# Empty means no extra completion behavior — the receipt's `suggest`
# already points the pipeline at the next leg.
on_complete = ""

# Deliberately absent: no card-template swap — cardlayout.py and sibling
# pipeline skills parse assets/alignment-card-template.md's exact section
# shapes, so a swapped template would break filing downstream.
